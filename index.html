<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://base44.com/logo_v2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <title>Base44 APP</title>
    <script>
      (() => {
        const isAttorneyHubRoute = () => {
          const path = window.location.pathname;
          return path === '/AttorneyHub' || path === '/present/hub';
        };

        const collapseAttorneyHub = () => {
          if (!isAttorneyHubRoute()) return;

          window.localStorage.setItem('attorney-hub-left-collapsed', 'true');

          let attempts = 0;
          const tryCollapseAppSidebar = () => {
            if (!isAttorneyHubRoute()) return;

            const appTitle = Array.from(document.querySelectorAll('h1')).find(
              (element) => element.textContent?.trim() === 'Case Presenter'
            );

            if (!appTitle) {
              if (attempts < 20) {
                attempts += 1;
                window.setTimeout(tryCollapseAppSidebar, 150);
              }
              return;
            }

            const collapseButton = Array.from(document.querySelectorAll('button')).find(
              (button) => String(button.className).includes('hidden lg:flex')
            );

            if (collapseButton) {
              collapseButton.click();
            }
          };

          tryCollapseAppSidebar();
        };

        collapseAttorneyHub();

        const wrapHistoryMethod = (methodName) => {
          const original = window.history[methodName];
          window.history[methodName] = function (...args) {
            const result = original.apply(this, args);
            window.dispatchEvent(new Event('base44-route-change'));
            return result;
          };
        };

        wrapHistoryMethod('pushState');
        wrapHistoryMethod('replaceState');
        window.addEventListener('popstate', collapseAttorneyHub);
        window.addEventListener('base44-route-change', collapseAttorneyHub);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
